version: "3.9"

services:
  backend:
    image: python:3.12-slim
    container_name: backend
    working_dir: /app
    env_file:
      - ./env/backend.dev.env
    command: bash -lc "pip install --no-cache-dir -r requirements.txt || true && python manage.py migrate || true && python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app:cached
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: node:20
    container_name: frontend
    working_dir: /app
    env_file:
      - ./env/frontend.dev.env
    command: bash -lc "npm install || true && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
