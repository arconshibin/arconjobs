services:
  backend:
    image: python:3.12-slim
    container_name: backend
    working_dir: /app
    env_file:
      - ./env/backend.dev.env
    # Install OS libs needed by Pillow, then Python deps, run migrations, then dev server
    command: bash -lc "
      apt-get update &&
      apt-get install -y --no-install-recommends gcc build-essential libjpeg62-turbo-dev zlib1g-dev &&
      rm -rf /var/lib/apt/lists/* &&
      pip install --no-cache-dir -r requirements.txt &&
      python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app:cached
      - media_volume:/app/media            # persist uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    image: node:20
    container_name: frontend
    working_dir: /app
    env_file:
      - ./env/frontend.dev.env
    command: bash -lc "npm install && npm run dev -- --host"
    ports:
      - "5173:5173"
    volumes:
      - ../frontend:/app:cached
      - /app/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    ports:
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  media_volume:
